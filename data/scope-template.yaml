# Authorisation scope for AppSec Verifier (VER-001), written by the guided run
# because no scope file was found. This file is the authorisation for an active
# security test: fill in only a target you are allowed to test, then start the
# guided run again. Until every EDIT field is filled in, the file is invalid and
# the Verifier refuses to use it. Reference: schemas/scope.schema.yaml,
# docs/cli.md ("Scope file"), examples/juice-shop/scope.yaml.

schema_version: 1

base_url: null                # EDIT: e.g. https://app.test.example.com

# hosts: [app.test.example.com]   # default: only the host of base_url
# ports: [443]                    # default: only the port of base_url
# path_prefixes: [/]              # default: /
# deny_paths: []

window:
  from: null                  # EDIT: start of the authorised test window, ISO-8601 UTC, e.g. "2026-11-01T00:00:00Z"
  until: null                 # EDIT: end of the window

owner:
  name: null                  # EDIT: the person or party accountable for this test
  contact: null
  reference: null             # ticket, engagement id, or approval reference

environment: other            # local | test | staging | other

expected_build:
  commit: null                # commit the assessment was produced against, for the build check (VER-003)
  version: null

allow_state_change: false     # true only for a disposable instance: allows marked write probes (VER-014)
