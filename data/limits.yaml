# Default execution bounds for a verification run (VER-015). Every value here is
# a default that the invocation can override: --cost-limit, --max-requests,
# --max-attempts, --max-calls, --max-duration, --rate. Reaching any bound stops the affected
# work rather than pressing on; the run stays cancellable. These bounds protect
# the target from accidental load, cap the cost of a run, and keep it from
# drifting beyond the finding under test. Every value must be greater than 0;
# only rate_rps may be 0, which turns the rate limit off. A key the Verifier
# does not enforce is an error, not ignored.
#
# Retries: a failed request is never retried. The only resend is one new login
# and one repeat of the request after the target answers 401 (VER-028).

version: 1

limits:
  # Model-spend ceiling for the whole run, in USD. When a run would exceed it,
  # it stops with exit 3 (VER-015). Not available with the subscription profiles
  # codex-cli and copilot-cli, which report no cost; max_calls bounds them.
  cost_limit_usd: 10.0

  # Cap on model calls (planning steps) across the run, for every profile.
  max_calls: 500

  # Hard cap on total HTTP requests sent to the target across the run.
  max_requests: 2000

  # Cap on agent steps (planning calls, each one tool call or the verdict) for a
  # single finding before it is called inconclusive (limits_hit: attempts).
  max_attempts: 12

  # Wall-clock ceiling for the whole run, in seconds (default 30 min).
  max_duration_s: 1800

  # Maximum request rate to the target and its login endpoints, requests per
  # second; requests, the proof browser's included, are spaced 1/rate_rps apart.
  rate_rps: 5
