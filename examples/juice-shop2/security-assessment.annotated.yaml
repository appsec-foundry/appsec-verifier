tier_root_causes:
  edge:
  - Server-supplied or URL data marked trusted HTML, bypassing Angular sanitizer
  - Session token kept in script-readable localStorage
  - OAuth implicit flow lacks state, nonce and audience validation
  - Client derives credentials and sends secrets in URLs
  server:
  - Object access by request id without ownership predicate
  - Owner and privileged fields taken from request body
  - Routes registered without authentication or role checks
  - Untrusted input reaches SQL, NoSQL, template, eval, path and XML sinks
  - Weak JWT handling and recovery; business rules not enforced server-side
  data:
  - Passwords hashed with fast unsalted MD5 and no strength policy
  - Card numbers and TOTP secrets stored in plaintext
