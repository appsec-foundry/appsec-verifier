  mitigation_title: Render feedback as text and drop the sanitizer bypass
  primary_actor: ACT-D-01
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/79.html
    steps:
    - Remove the bypassSecurityTrustHtml calls and render feedback comments as text
      with interpolation, building the star markup separately in the template.
    - Bind searchValue as plain text with interpolation instead of innerHTML.
    - Bind orderId with interpolation inside a code element.
    - Sanitize or encode feedback comments server-side on write.
    - Add a strict Content-Security-Policy.
    verification: Submit a feedback comment with an HTML event handler or script,
      open a search link with an HTML payload in q, and track an order id containing
      markup; confirm each renders as inert text in the About, administration, search
      and tracking views with no script execution.
  risk: High
  scenario: Several frontend components mark untrusted data as trusted HTML and bind
    it to innerHTML. In the About page (frontend/src/app/about/about.component.ts:119)
    the raw feedback comment is embedded in an HTML string, so a feedback comment
    with script-bearing markup submitted via the feedback API executes in every visitor's
    browser and can read the localStorage JWT. In frontend/src/app/administration/administration.component.ts:91
    feedback comments are trusted in the admin table and details dialog (and the about
    gallery), so the payload runs for admins and can steal the admin token. In frontend/src/app/search-result/search-result.component.ts:143
    the q query parameter is passed to bypassSecurityTrustHtml, so a crafted search
    link runs script in the victim's origin and can steal the JWT and cookie. In frontend/src/app/track-result/track-result.component.ts:48
    the orderId from the track-order API is wrapped in a code tag and trusted; if
    an attacker controls the stored or echoed value, script runs in the viewer's browser.
    The finding holds further places beyond those cited (location_count is 5). Server-side
    sanitization of POST /api/Feedbacks was not served.
