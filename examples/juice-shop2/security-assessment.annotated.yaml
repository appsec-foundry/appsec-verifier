verdict:
  severity: red
  opening: This web shop lets anonymous visitors take over the database, run their
    own code on the server and register as administrators. It should run only as an
    isolated training target and must never hold real customer data or be reachable
    from the internet.
  bullets:
  - title: Shop database readable and alterable by anyone
    body: SQL injection in product search and login lets unauthenticated visitors
      read user records and sign in as other users.
    findings:
    - F-004
    - F-011
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Server takeover through a profile name
    body: Code injection lets any signed-in user run commands of their choice on the
      server by setting a crafted username.
    findings:
    - F-012
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Customers can read and change each other's records
    body: Missing ownership checks (IDOR) let any signed-in customer read or modify
      another customer's orders, baskets and addresses.
    findings:
    - F-010
    weaknesses:
    - W-007
    verified_attack_path: false
  - title: Anyone can become an administrator
    body: Mass assignment on registration lets an anonymous visitor choose the administrator
      role for a new account.
    findings:
    - F-067
    - F-068
    - F-066
    weaknesses:
    - W-008
    verified_attack_path: true
  - title: Login tokens can be forged for any user
    body: A hard-coded token signing key and unpinned verification let anyone with
      the source code mint tokens for any account, including admin.
    findings:
    - F-078
    - F-048
    weaknesses:
    - W-003
    - W-046
    verified_attack_path: true
  closing: Until these gaps are closed, treat every account, order and stored credential
    in this system as exposed to anonymous internet visitors.
  bullets_intro: 'Security concerns behind this assessment:'
