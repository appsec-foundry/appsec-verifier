- result_id: VF-022
  finding_ref:
    id: T-034
    match_key: routes/trackorder.ts|CWE-943
    instance: routes/trackOrder.ts:18
    title: NoSQL injection in order tracking $where predicate — routes/trackOrder.ts:18
    cwe: CWE-943
    variant: variant-001
    variant_digest: b2749fff0d93b959e9eac8d04fbe0ce6c0387721a14a9ca182dea95bebaba032
  class: injection
  eligibility:
    status: dynamic
    reason: 'proof: behavioural-difference'
  verdict: confirmed
  confidence: medium
  rationale: 'The id parameter in GET /rest/track-order/:id is spliced unescaped into
    the server-side $where JS predicate this.orderId === ''${id}''. Using a known
    valid orderId, appending a closing quote plus an injected boolean sub-expression
    and re-closing the string (e.g. ''5267-173e24c7ffc77007'' && (655396===655396)
    && ''x''==''x'') caused the predicate to still evaluate true and return the full
    real order document (including the masked email field), while the complementary
    false sub-expression (655396===661429) suppressed the match and returned only
    the synthetic fallback object lacking the email field. This true/false split was
    reproduced twice with both the === and !== predicate forms, confirming genuine
    control over the server-side JavaScript boolean expression rather than mere reflection.
    This demonstrates the injection primitive described in the finding: attacker-controlled
    boolean logic inside the $where predicate, which (as shown earlier in steps 6/9
    with an OR-based tautology) also lets an attacker broaden matching to other customers''
    orders.'
  proof:
    checked: true
    contract: 3
    steps:
    - 26
