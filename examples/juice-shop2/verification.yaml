  verdict: confirmed
  confidence: medium
  rationale: The error-probe control confirmed SQL injection in the q parameter of
    GET /rest/products/search. An unbalanced single quote (apple') consistently triggered
    a backend engine error (status 500) while its balanced counterpart (apple'') returned
    200 across two repetitions. Double-quote and backtick variants (not the string-delimiting
    character used by the backend) showed no difference, isolating the single quote
    as the syntactically significant character, consistent with q being concatenated
    unescaped into a single-quoted SQL LIKE clause as described in routes/search.ts:23.
    This split into two stable response classes (error vs success) based solely on
    quote balance, which is proof of unescaped SQL string interpolation (CWE-89),
    matching the finding's mechanism trace.
