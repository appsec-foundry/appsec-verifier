# Example identities for a target whose sessions come from an SSO / OIDC
# identity provider. The two users sign in in your own browser, MFA included;
# the Verifier never sees their passwords (VER-028). The provider needs a
# client (here verifier-cli) that allows a loopback redirect to 127.0.0.1 and
# issues tokens the application's API accepts. Remaining secrets are env
# references only (VER-016); a variable that is not set is asked for hidden in
# an interactive run. To set one without leaving it in the shell history:
#
#   read -rs VERIFIER_SVC_TOKEN && export VERIFIER_SVC_TOKEN   # pre-issued bearer
#
# Each identity sends its credentials only to its own endpoint, which must be
# the target or a scope `auth_hosts` entry (sso.example.com here); the issuer's
# discovery document names the endpoints. Schema: schemas/identities.schema.yaml.

identities:
  # Two end users, signed in one after the other in the browser; prompt=login
  # makes the provider ask again for the second one. They are the pair the
  # access-control / IDOR proofs contrast (VER-010).
  - role: user-a
    method: oidc-authorization-code
    auth:
      issuer: https://sso.example.com/realms/app
      client_id: verifier-cli
      scope: openid
      target_origin: https://app.staging.example.com

  - role: user-b
    method: oidc-authorization-code
    auth:
      issuer: https://sso.example.com/realms/app
      client_id: verifier-cli
      scope: openid
      target_origin: https://app.staging.example.com

  # A pre-issued bearer token for a service identity.
  - role: service
    method: bearer
    auth:
      token_env: VERIFIER_SVC_TOKEN
      target_origin: https://app.staging.example.com

  - role: anonymous
    method: none
