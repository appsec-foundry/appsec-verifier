verdict:
  severity: red
  opening: This deliberately vulnerable web application lets anonymous attackers run
    commands on the server, rewrite its database and make themselves administrators.
    Acceptable only as an isolated training target; it must never hold real data or
    be reachable outside a closed network.
  bullets:
  - title: Server takeover through command injection
    body: Request data is placed into operating-system commands, so an unauthenticated
      caller can run arbitrary commands on the server.
    findings:
    - F-007
    - F-032
    weaknesses:
    - W-001
    - W-009
    verified_attack_path: false
  - title: Database read and changed by outsiders
    body: SQL injection lets a caller rewrite or extract stored records, and some
      paths need no sign-in.
    findings:
    - F-002
    - F-022
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Anyone can become administrator
    body: Missing authorization checks and mass assignment on user records let any
      caller grant themselves admin rights or edit other profiles.
    findings:
    - F-035
    - F-034
    - F-033
    weaknesses: []
    verified_attack_path: true
  - title: Database wiped and admin password reset
    body: The setup page needs no sign-in, so an anonymous visitor can destroy the
      data and restore publicly known admin credentials.
    findings:
    - F-036
    - F-017
    weaknesses: []
    verified_attack_path: false
  - title: Login tokens can be forged
    body: Hard-coded signing keys and weak token encryption let anyone with the source
      code mint valid login tokens.
    findings:
    - F-009
    - F-011
    - F-028
    weaknesses:
    - W-005
    - W-006
    verified_attack_path: false
  - title: Repository secrets exposed in build logs
    body: The build workflow prints every stored secret in lightly encoded form, readable
      by anyone who can view the logs.
    findings:
    - F-023
    weaknesses:
    - W-012
    - W-014
    verified_attack_path: false
  closing: Left reachable beyond a closed training network, these weaknesses would
    give outsiders full control of the system and its data.
  bullets_intro: 'Security concerns behind this assessment:'
