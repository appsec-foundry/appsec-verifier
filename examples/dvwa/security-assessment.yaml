security_controls:
- assessment: The MariaDB container's root password is hardcoded in compose.yml as
    a weak, guessable value (dvwa), and the application user password is also set
    inline in the environment block. Secrets are not injected from a secret store
    or an external env file. Those values are committed to source. This is a deliberately
    vulnerable training app, but the credential handling is weak.
  component_ids:
  - component-1b84dba2f3e10e46
  control: Database credential management
  domain: Cryptography Secrets and Data Protection
  effectiveness: Weak
  evidence:
  - file: compose.yml
    line: 31
  implementation: 'compose.yml db service environment: MYSQL_ROOT_PASSWORD, MYSQL_USER,
    MYSQL_PASSWORD'
  kind: mechanism
- assessment: The db service publishes no host ports and joins only the dedicated
    dvwa compose network, so it is reachable only from containers on that network.
    The web service is bound to 127.0.0.1. The data volume is persistent with no encryption
    configured in this file. The image uses a floating tag (mariadb:10), so it is
    not pinned to a digest. TLS for the app-to-DB connection is not evidenced.
  component_ids:
  - component-1b84dba2f3e10e46
  control: Database network isolation and persistence
  domain: Operations Runtime and Supply Chain Controls
  effectiveness: Partial
  evidence:
  - file: compose.yml
    line: 37
  implementation: 'compose.yml db service: networks, volumes, image'
  kind: mechanism
- assessment: Actions are referenced by version tags (e.g. docker/login-action@v3,
    codeql-action@v4.33.0), not commit SHAs, and the inspected workflows declare no
    explicit permissions block, so GITHUB_TOKEN scope depends on repository defaults.
    The docker-image workflow pushes to ghcr.io using GITHUB_TOKEN.
  component_ids:
  - component-8e8c82f91b0e01fb
  control: CI workflow action pinning and permissions
  domain: Operations Runtime and Supply Chain Controls
  effectiveness: Weak
  evidence:
