  risk: Critical
  scenario: Request data is concatenated into shell commands in several places. At
    vulnerabilities/api/src/HealthController.php:88, an unauthenticated attacker POSTs
    JSON to /vulnerabilities/api/v2/health/connectivity with a target such as '127.0.0.1;
    id'. The value is concatenated into exec('ping -c 4 ' . $target) with no authentication
    or escaping, giving command execution as the web server user, with code execution
    and data theft as the consequence. Input read at HealthController.php:84 reaches
    that call. At vulnerabilities/exec/source/low.php:14, an authenticated user posts
    an ip value such as '127.0.0.1; id'. It is concatenated into shell_exec with no
    validation and the output is reflected. Input read at low.php:5 reaches that call.
    At vulnerabilities/exec/source/high.php:30, a blacklist str_replace strips only
    some metacharacters. A bare '|' is not stripped, though '|' followed by a space
    is, so an attacker can chain commands with unfiltered characters such as '|' or
    '&' variants. Input read at high.php:5 reaches that call. Scanners noted that
    reachability of these paths requires verification. The finding holds further places
    beyond the three cited, with location_count 7.
