  mechanism_id: build-pipeline-mutable-refs
  affected_components:
  - component-8e8c82f91b0e01fb
  description: CI/CD workflows resolve third-party actions and other build dependencies
    to mutable tags or branches instead of immutable commit digests, so a retagged
    or compromised upstream runs inside the pipeline with its token and secret scope.
  structural_recommendation: pin every third-party action and build dependency to
    an immutable commit SHA (or a vetted internal mirror) and enforce SHA-pinning
    in CI
meta_findings:
- id: MF-001
  title: Insufficient Secret Management
  category: Insufficient Secret Management
  summary: '4 findings trace to secrets, keys, or tokens stored directly in source
    code. The architectural concern is not the individual values — they can be rotated
    — but the absence of a secret-management substrate: no env-var convention, no
    vault/KMS integration, no pre-commit scan. Rotating individual secrets addresses
    symptoms; instituting the substrate addresses the gap.'
  derived_from:
  - T-009
  - T-027
  - T-028
  - T-053
  severity: High
  recommended_mitigation_id: null
