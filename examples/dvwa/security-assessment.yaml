  mitigation_title: Use prepared statements and enforce authorization
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/89.html
    steps:
    - Use mysqli prepared statements (mysqli_prepare) with bound parameters in all
      these queries, and cast id to int.
    - Check admin authorization on change_user_details.php at every security level.
    - Compare password hashes with a modern password hashing API instead of md5.
    - Do not trust X-Forwarded-For unless set by a known proxy, and validate it with
      filter_var(FILTER_VALIDATE_IP) before storing.
    verification: Submit a single quote in first_name, in the brute force username,
      and in X-Forwarded-For, and confirm query structure is unchanged, the value
      is stored literally with no SQL error, and non-admins receive an access denied
      result on change_user_details.php.
  remediation_reference: null
  risk: High
  scenario: Request data is concatenated into SQL in several places. At vulnerabilities/authbypass/change_user_details.php:47,
    first_name, surname and id from the JSON body are concatenated into an UPDATE.
    At non-impossible levels no authentication or authorization check applies, so
    any caller can alter arbitrary rows or inject SQL. At vulnerabilities/brute/source/low.php:13,
    an authenticated attacker sends a username such as admin' -- through the GET login
    parameters. It is concatenated into the SELECT, bypassing the password check or
    extracting data. Input read at brute/source/low.php:5 reaches that call. At vulnerabilities/bac/source/low.php:81,
    an authenticated attacker sets X-Forwarded-For to a SQL fragment, which is concatenated
    into the bac_log INSERT. Only user_id is checked, so the header is not. Input
    read at bac/source/low.php:77 reaches that call. At vulnerabilities/bac/source/medium.php:73,
    the same header injection works at medium level, where only user_id is regex validated.
    This allows data manipulation or error-based extraction. Scanners noted that reachability
    requires verification. The finding holds further places beyond those cited, with
    location_count 16.
