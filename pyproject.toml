[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "docs", "examples", "schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "UP017",  # datetime-timezone-utc — timezone.utc is fine; no mass rewrite to datetime.UTC
]
